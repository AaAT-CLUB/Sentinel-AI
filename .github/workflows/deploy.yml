name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 159.223.179.219
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Pull latest code
            cd /root/Sentinel-AI
            git pull origin main

            # Update frontend files
            cp WebServer/frontend/index.html  /var/www/sentinel/
            cp WebServer/frontend/styles.css  /var/www/sentinel/
            cp WebServer/frontend/script.js   /var/www/sentinel/

            # Update backend services
            cp WebServer/backend/app/services/scanner_shell.py /root/sentinel-ai/backend/app/services/scanner_shell.py
            cp WebServer/backend/app/services/analyzer.py      /root/sentinel-ai/backend/app/services/analyzer.py
            cp WebServer/backend/app/routes/analyze.py         /root/sentinel-ai/backend/app/routes/analyze.py
            cp WebServer/backend/app/main.py                   /root/sentinel-ai/backend/app/main.py

            # Restart API
            systemctl restart sentinel-api

            # Update DataEngineeringTeam Nest API. The .env file is managed on
            # the droplet and must not be overwritten by deployment.
            cd /root/Sentinel-AI/DataEngineeringTeam
            npm ci
            npm run build
            if systemctl list-unit-files sentinel-data-api.service >/dev/null 2>&1; then
              systemctl restart sentinel-data-api
            else
              echo "sentinel-data-api.service not installed yet; skipping restart"
            fi

            echo "Deploy complete"
